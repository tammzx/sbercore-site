services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sberone
      POSTGRES_PASSWORD: sberone
      POSTGRES_DB: sberone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Данные только в РФ: деплой в РФ-зону облака, бэкапы — в SberCloud РФ

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  pgdata:
